  <circle cx="1135" cy="259" r="4" fill="#596273"/>
  <path d="M899 265H943L965 243" stroke="#FF8450" stroke-opacity="0.5"/>
  <circle cx="899" cy="265" r="4" fill="#FF8450"/>
  <path d="M1063 119L1086 96H1122" stroke="#FF8450" stroke-opacity="0.5"/>
  <circle cx="1122" cy="96" r="4" fill="#FF8450"/>

  <text x="975" y="169" fill="#F6F1E9" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="800">10M+</text>
  <text x="970" y="193" fill="#929BAB" font-family="Consolas, Menlo, monospace" font-size="9" letter-spacing="0.8">RECORDS</text>
